name: Rocana
description: 'Rocana (formerly ScalingData) was an IT operations analytics company founded in 2014
  in San Francisco and backed by GV. Its product captured and analyzed all machine data from all
  sources across data-center infrastructure, keeping it online and queryable for years so operations
  teams could perform root-cause analysis and surface emerging IT problems before they caused
  outages. The company raised roughly $19.4M before being acquired by Splunk in 2017, after which
  the independent Rocana product and brand were wound down. It was surfaced as a GV portfolio
  company and added to the API Evangelist network. Enrichment on 2026-07-21 confirmed there is no
  live public website (rocana.com no longer resolves), no developer portal, no API, and no client
  packages — the company no longer operates independently.'
